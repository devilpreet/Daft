name: Fork — Build Wheels

on:
  push:
    branches:
      - feature/avro-tar-support
    tags:
      - "v*"

# Cancel in-progress runs for outdated branch pushes (not for tags, which are unique).
concurrency:
  group: fork-build-wheel-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

env:
  PYTHON_VERSION: "3.11"
  DAFT_ANALYTICS_ENABLED: "0"

jobs:
  build-wheel:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — standard manylinux_2_28
          - target: x86_64
            runner: ubuntu-latest
            manylinux: "2_28"
          # Linux aarch64 — manylinux_2_28, QEMU cross-compile on x86_64 host
          # (jemalloc requires 64 KiB page size on aarch64)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_28"
            before_script: export JEMALLOC_SYS_WITH_LG_PAGE=16
          # macOS arm64 (Apple Silicon / AWS Graviton macOS runners)
          - target: aarch64-apple-darwin
            runner: macos-14
          # macOS x86_64 (Intel)
          - target: x86_64-apple-darwin
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.5

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: -i python${{ env.PYTHON_VERSION }} --profile release --out dist
          sccache: true
          before-script-linux: ${{ matrix.before_script || '' }}
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

      # On tag push: create/update GitHub Release and attach wheel
      - name: Upload wheel to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: false

  # Print sccache stats after all builds (handy to see hit rate on first run)
  sccache-stats:
    name: sccache stats
    needs: build-wheel
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.5
      - run: sccache --show-stats
